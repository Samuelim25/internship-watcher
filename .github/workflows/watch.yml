name: Watcher (chip-design internships + weekly digest)

on:
  schedule:
    # Sunday 14:00 UTC (~10am ET): weekly chip-design programs / shuttles /
    # conference student programs / scholarships digest.
    - cron: "0 14 * * 0"
    # Hourly role sweep for Summer 2027 FPGA / ASIC / RTL / DSP design
    # internships. Retuned 2026-08-19. Controlled by `top_firms_only` (off) and
    # `summer_2027_only` (on) in config.json -> filters.
    - cron: "0 * * * *"
  workflow_dispatch:      # "Run workflow" button
    inputs:
      mode:
        description: "What to run"
        required: false
        default: internships
        type: choice
        options:
          - internships   # full chip-design role sweep
          - digest        # programs/shuttles/scholarships digest
          - verify        # probe every source, report the dead ones

permissions:
  contents: write          # allows committing the updated seen_jobs.json

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Digest ONLY on the Sunday cron or an explicit "digest" run --
          # every other trigger runs the role sweep.
          DIGEST_MODE: ${{ (github.event.schedule == '0 14 * * 0' || github.event.inputs.mode == 'digest') && '1' || '0' }}
        if: ${{ github.event.inputs.mode != 'verify' }}
        run: python watcher.py

      # A mistyped ATS token returns zero jobs instead of raising, which is
      # indistinguishable from "nothing is open". This surfaces those.
      - name: Verify sources
        if: ${{ github.event.inputs.mode == 'verify' }}
        run: python verify_sources.py

      - name: Run filter regression tests
        if: ${{ github.event.inputs.mode == 'verify' }}
        run: python test_filters.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          [ -f OPEN_ROLES.md ] && git add OPEN_ROLES.md || true
          [ -f TOP_PICKS.md ] && git add TOP_PICKS.md || true
          if git diff --quiet --cached; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Update seen jobs [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $i failed (remote moved); retrying..."
            sleep 5
          done
          echo "Could not push state this run; it will retry next run."
